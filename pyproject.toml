[project]
name = "igarape"
version = "0.2.0"
description = "Generate Python services with an agentic SDLC for Codex, Claude Code, GitHub Copilot and OpenCode"
readme = "README.pypi.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["copier>=9.4,<10", "uv"]

[project.urls]
Repository = "https://github.com/spassos/igarape"
Issues = "https://github.com/spassos/igarape/issues"

[project.scripts]
igarape = "igarape.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src/igarape", "/pyproject.toml", "/README.md", "/README.pypi.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["src/igarape"]

[dependency-groups]
dev = [
    "hypothesis>=6.140",
    "pytest>=8.3",
    "pyyaml>=6",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
extend-exclude = ["template"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not slow and not smoke'"
testpaths = ["tests"]
markers = [
    "slow: runs make check in each generated project (Docker for integration profiles)",
    "smoke: generates and exercises the default API over HTTP without Docker",
]
