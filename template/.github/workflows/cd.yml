# Continuous Delivery: main -> CI -> signed image -> staging (verified) -> production (approval + verified).
# Setup: docs/ways-of-working.md#entrega-cicd
name: Main CI and optional delivery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  build:
    if: vars.ENABLE_CD == 'true' && github.ref == 'refs/heads/main'
    name: Build, push and attest image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: name
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.repo }}:${{ github.sha }}
            ${{ steps.name.outputs.repo }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.repo }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - id: ref
        env:
          REPO: ${{ steps.name.outputs.repo }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image=$REPO@$DIGEST" >> "$GITHUB_OUTPUT"

  staging:
    needs: build
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
    with:
      environment: staging
      image: ${{ needs.build.outputs.image }}

  production:
    needs: [build, staging]
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
    with:
      environment: production
      image: ${{ needs.build.outputs.image }}
