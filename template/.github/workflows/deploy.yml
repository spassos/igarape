# Reusable deploy: roll out, then *prove* the release is live (version + readiness), else roll back.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image:
        type: string
        required: true
    secrets:
      # Resolved from the GitHub Environment secrets of the job below.
      KUBECONFIG_DATA:
        required: false

permissions: {}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE: ${{ inputs.image }}
      KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check deployment settings
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          : "${APP_URL:?Set APP_URL in the target GitHub Environment}"
      - name: Roll out
        id: rollout
        run: scripts/deploy.sh deploy
      - name: Verify the release is live and ready
        id: verify
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: python3 scripts/smoke.py --url "$APP_URL" --version "$GITHUB_SHA"
      - name: Roll back
        if: failure() && (steps.rollout.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: scripts/deploy.sh rollback
