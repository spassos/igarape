<!doctype html>
<!-- Open Graph card for the landing page, rendered to site/public/og.png by make-og-image.cjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #0b3d2e;
    color: #ffffff;
    font-family: Inter, "DejaVu Sans", sans-serif;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 96px;
    box-sizing: border-box;
    position: relative;
  }
  img { width: 300px; height: 300px; border-radius: 64px; box-shadow: 0 0 0 4px #1e8c7e; flex: none; }
  h1 { margin: 0; font-size: 128px; line-height: 1; letter-spacing: -3px; font-weight: 800; }
  p { margin: 28px 0 0; font-size: 52px; line-height: 1.15; color: #f4a259; font-weight: 600; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 14px; background: #2ec4b6; }
</style>
</head>
<body>
  <img src="../../docs/assets/icon.svg" alt="">
  <div>
    <h1>Igarapé</h1>
    <p>From idea to production</p>
  </div>
  <div class="bar"></div>
</body>
</html>
