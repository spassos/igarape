<!doctype html>
<!-- Open Graph card for the landing page, rendered by make-og-image.cjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Bricolage Grotesque";
    src: url("../public/assets/bricolage-grotesque.woff2") format("woff2");
    font-weight: 650;
  }
  * { box-sizing: border-box; }
  body {
    display: grid;
    grid-template-columns: 1fr 520px;
    align-items: center;
    gap: 36px;
    width: 1200px;
    height: 630px;
    margin: 0;
    padding: 54px;
    background: #122720;
    color: #f4f5ea;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
  }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 32px; font-weight: 650; }
  .icon { width: 54px; height: 54px; border-radius: 11px; }
  h1 { margin: 34px 0 0; font-size: 66px; line-height: 1; letter-spacing: -.04em; font-weight: 650; }
  h1 span { color: #daeea7; }
  .river { width: 100%; height: 510px; object-fit: cover; border-radius: 20px; border: 1px solid #40584b; }
</style>
</head>
<body>
  <div>
    <div class="brand"><img class="icon" src="../../docs/assets/icon.svg" alt=""> Igarapé</div>
    <h1>Python services.<br><span>Ready for agents.</span></h1>
  </div>
  <img class="river" src="../public/assets/river.webp" alt="">
</body>
</html>
