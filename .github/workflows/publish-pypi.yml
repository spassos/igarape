# Release and publish the CLI. On every push to main, release-please keeps a release PR (version in
# pyproject.toml and uv.lock, CHANGELOG.md) from Conventional Commits; merging it tags vX.Y.Z and
# publishes the GitHub release. The same run then builds, tests and publishes to PyPI: a release
# created with GITHUB_TOKEN starts no other workflow, so publishing cannot wait for a release event.
# The file name is the PyPI trusted publisher's workflow name (docs/pypi.md); keep it.
name: Release and publish CLI to PyPI

on:
  push:
    branches: [main]
  # Re-publish the version on main, e.g. after a failed upload.
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release PR, tag and GitHub release (release-please)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      created: ${{ steps.release-please.outputs.release_created }}
    steps:
      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release
    # Runs for a release just created on push, or on a manual dispatch (release skipped).
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && (needs.release.outputs.created == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Build and check distributions
        run: |
          uv lock --check
          uv build --no-sources
          uvx twine check --strict dist/*
      - name: Generate and test a service with the release wheel
        working-directory: ${{ runner.temp }}
        run: |
          uvx --isolated --from "$GITHUB_WORKSPACE"/dist/*.whl igarape new orders-api --template "$GITHUB_WORKSPACE"
          make -C orders-api test-unit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    # Explicit result check: a skipped release (manual dispatch) would otherwise skip this job.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/igarape/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
