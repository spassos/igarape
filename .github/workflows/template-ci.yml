name: Template CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  render:
    name: Render scenarios
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pytest
      - name: Generate and start the default API
        run: uv run pytest -m smoke
      - name: Generated workflows security (zizmor)
        # Conditional workflow files only get a .yml name once rendered, so scan a project
        # generated with every agent as well as this repository's own workflows.
        run: |
          uv run igarape new "$RUNNER_TEMP/all-agents" --template . \
            --agent claude --agent codex --agent copilot --agent opencode
          uvx zizmor --offline --min-severity medium "$RUNNER_TEMP/all-agents/.github/workflows" .github/workflows

  generated-project:
    name: make check (${{ matrix.scenario }})
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: [all-agents, full-kafka, minimal, with-mcp, postgres-rabbit, redis-only]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - run: uv run pytest -m slow -k "$SCENARIO"
        env:
          SCENARIO: ${{ matrix.scenario }}

  image:
    name: Generated image (${{ matrix.profile }})
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default profile: no infrastructure, so the container must start and pass the smoke test.
          - profile: in-memory
            flags: ""
            smoke: true
          # Needs Postgres/Redis/Kafka to become ready: build, check entrypoints and migrations, scan.
          - profile: full-kafka
            flags: --postgres --redis --broker kafka
            smoke: false
    env:
      IMAGE: svc:ci
      CONTAINER: svc-ci
      APP_VERSION: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --locked
      - name: Generate the service with the CLI
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          read -ra flags <<< "$FLAGS"
          uv run igarape new "$RUNNER_TEMP/svc" --template "$GITHUB_WORKSPACE" "${flags[@]}"
      - name: Build the image
        run: docker build --build-arg APP_VERSION="$APP_VERSION" -t "$IMAGE" "$RUNNER_TEMP/svc"
      - name: Start the container
        if: matrix.smoke
        run: docker run -d --name "$CONTAINER" -p 127.0.0.1:8000:8000 "$IMAGE"
      - name: Smoke test (/health/live reports the build version, /health/ready is ok)
        if: matrix.smoke
        run: |
          python3 "$RUNNER_TEMP/svc/scripts/smoke.py" --url http://127.0.0.1:8000 \
            --version "$APP_VERSION" --attempts 20 --delay 2
      - name: Container logs
        if: failure() && matrix.smoke
        run: docker logs "$CONTAINER"
      - name: Entrypoints and migrations are packaged
        if: ${{ !matrix.smoke }}
        run: |
          docker run --rm "$IMAGE" python -c \
            "import svc.entrypoints.http.app as http, svc.entrypoints.worker as worker; http.create_app; worker.create_worker"
          docker run --rm "$IMAGE" alembic history
      - name: Vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Stop the container
        if: always() && matrix.smoke
        run: docker rm -f "$CONTAINER"
