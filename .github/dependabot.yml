# Weekly, grouped updates; a new version must be 7 days old before it is proposed.
# Security updates (when enabled in the repository settings) are not delayed by the cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    # The template's workflows are rendered into every generated project, so keep them current too.
    # Files with Jinja in their name (e.g. the Copilot setup steps) are not scanned; the
    # tests/test_action_pins.py guard keeps them aligned with the rest.
    directories: ["/", "/template"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"
